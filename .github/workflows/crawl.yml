# Scheduled crawl + publish, no server required.
#
# IMPORTANT: this needs a PRODUCTION Riot API key. Personal keys expire every
# 24 hours, so automation will start failing on day two. Run the crawler by hand
# on your own machine until you're approved for a production key.
#
# Setup:
#   1. Repo Settings -> Secrets and variables -> Actions -> New repository secret
#      Name: RIOT_API_KEY   Value: RGAPI-...
#   2. Settings -> Pages -> Source: "GitHub Actions"
#   3. The published stats land at https://<you>.github.io/<repo>/data/

name: crawl-and-publish

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:         # lets you trigger it manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: crawl
  cancel-in-progress: false   # never kill a crawl mid-flight; it wastes rate limit

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r pipeline/requirements.txt

      # Reuse the match store between runs so stats build up over time instead
      # of starting from zero every crawl.
      - name: Restore match store
        uses: actions/cache/restore@v4
        with:
          path: pipeline/tft.db
          key: tft-db-${{ github.run_id }}
          restore-keys: tft-db-

      - name: Crawl and publish
        working-directory: pipeline
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: |
          python scheduler.py --once \
            --platforms na1 euw1 \
            --tiers challenger grandmaster \
            --players-per-tier 100 \
            --matches-per-player 20 \
            --lookback-days 3 \
            --set 17

      - name: Save match store
        uses: actions/cache/save@v4
        if: always()
        with:
          path: pipeline/tft.db
          key: tft-db-${{ github.run_id }}

      # A project Page is served from /<repo>/, so the bundle needs that base
      # and the app has to read the published JSON directly -- there is no
      # stats server on Pages, so the default /api calls would 404 (actually
      # worse: they'd return index.html and fail to parse).
      - name: Build web app
        working-directory: app
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_STATIC_MODE: "true"
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: |
          mkdir -p site
          cp -r app/dist/* site/
          mkdir -p site/data
          cp -rL pipeline/public/current/* site/data/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: crawl
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
